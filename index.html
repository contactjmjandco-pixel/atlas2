<style>
/* Layout: full-bleed map with a parchment-dark side ledger on the left (bottom sheet on phones). Accent follows the faction of the open map. */
:root{
  color-scheme:dark;
  --ink:#0e161e;          /* the game's own map backdrop */
  --sea:#1e272c;          /* water colour of the in-game map, fills around the map picture */
  --panel:#141e28;
  --panel-2:#1b2733;
  --line:#2a3846;
  --fg:#e6e1d6;
  --muted:#93a0ad;
  --accent:#d9b45b;       /* Elyos gold; swapped per map */
  --accent-ink:#1a1408;
  --boss:#ef6a4c;
  --kib:#5fd3c4;
  --pet:#c9a6ff;
  --f-display:"Marcellus","Palatino Linotype","Book Antiqua",Georgia,serif;
  --f-body:"IBM Plex Sans",system-ui,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){--panel:#f3efe6;--panel-2:#e9e3d6;--line:#d3cab8;--fg:#1f2329;--muted:#5d6670;--ink:#0e161e;color-scheme:light}}
:root[data-theme="light"]{--panel:#f3efe6;--panel-2:#e9e3d6;--line:#d3cab8;--fg:#1f2329;--muted:#5d6670;--ink:#0e161e;color-scheme:light}
body[data-map="altgard"]{--accent:#a993f0;--accent-ink:#120d22}
body[data-map="abyss"]{--accent:#5fc0d8;--accent-ink:#06171c}
body[data-map="dungeon"]{--accent:#e0905a;--accent-ink:#1d0e04}
.dsel{width:100%;margin-top:6px}
.pets .else{display:flex;flex-direction:column;align-items:flex-start;gap:3px;cursor:default}
.pets .else .where{display:flex;flex-wrap:wrap;gap:4px;margin-top:2px}
.pets .else .where button,.pets .else .where span{font:11px var(--f-body);padding:1px 7px;border-radius:999px;border:1px solid var(--line);color:var(--muted);background:none}
.pets .else .where button{color:var(--fg);border-color:var(--accent);cursor:pointer}
.pets .else .where button:hover{background:var(--panel-2)}
.pets .else .where button:focus-visible{outline:2px solid #9b6cff;outline-offset:2px}
.pets h3.sec{font-size:11px;color:var(--fg);margin-top:16px;border-top:1px solid var(--line);padding-top:10px}
html,body{height:100%}
body{background:var(--ink);color:var(--fg);font-family:var(--f-body);font-size:14px;overflow:hidden}
.app{display:grid;grid-template-columns:clamp(420px,30vw,480px) 1fr;height:100%}
aside{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;min-width:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:16px;padding-block:16px 0}
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
h1{font-family:var(--f-display);font-weight:400;font-size:26px;letter-spacing:.02em;margin:0;text-wrap:balance}
h1{display:flex;align-items:center;gap:8px;white-space:nowrap}
h1 .star{font-family:"Segoe UI Symbol","DejaVu Sans",sans-serif;font-size:36px;line-height:1;color:#9b6cff;transform:translateY(-2px)}   /* the glyph sits on the baseline; lift it to the cap-height middle */
.brand{align-items:center;justify-content:flex-start;gap:12px;margin-bottom:14px}
.brand .sub{margin:0;white-space:nowrap;padding-top:4px}
.brand .sheet-toggle{margin-left:auto}
.sub{color:var(--muted);font-size:12px;margin:4px 0 14px}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:var(--panel-2);padding:4px;border-radius:8px}
.tabs button{font:500 13px var(--f-body);color:var(--muted);background:none;border:0;border-radius:6px;padding:8px 4px;cursor:pointer}
.tabs button small{display:block;font-size:10px;letter-spacing:.06em;text-transform:uppercase;opacity:.8}
.tabs button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.tabs button:focus-visible,.pet:focus-visible,.hit:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
/* search fields keep their ring; the language picker and checkbox rows show focus as a shaded background instead */
input[type=search]:focus-visible{outline:2px solid #9b6cff;outline-offset:2px}
select,.row input{outline:none}
select:focus{background:var(--panel)}
.row:has(input:focus-visible){background:var(--panel-2)}
.tools{display:grid;grid-template-columns:1fr auto;gap:6px;margin-top:12px;position:relative}
input[type=search],select{font:14px var(--f-body);color:var(--fg);background:var(--panel-2);border:1px solid var(--line);border-radius:6px;padding:8px 10px;min-width:0}
.results{position:absolute;top:100%;left:0;right:0;z-index:1200;margin-top:4px;background:var(--panel);border:1px solid var(--line);border-radius:8px;max-height:300px;overflow:auto;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.hit{display:flex;gap:8px;align-items:center;width:100%;text-align:left;background:none;border:0;color:var(--fg);padding:8px 10px;font:13px var(--f-body);cursor:pointer}
.hit:hover{background:var(--panel-2)}
.hit em{font-style:normal;color:var(--muted);font-size:11px;margin-left:auto;white-space:nowrap}
.scroll{overflow:auto;flex:1;min-height:0;margin-top:14px;padding:4px 4px 16px;margin-left:-4px}   /* 4px room so focus rings are not clipped by the scroll edge */
h2{font:600 11px var(--f-body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:18px 0 6px;display:flex;justify-content:space-between}
h2:first-child{margin-top:0}
.row{display:flex;align-items:center;gap:10px;padding:6px 4px;border-radius:6px;cursor:pointer}
.row:hover{background:var(--panel-2)}
.row input{accent-color:var(--accent);margin:0}
.row .n{margin-left:auto;font:12px var(--f-mono);color:var(--muted);font-variant-numeric:tabular-nums}
.sw{width:12px;height:12px;border-radius:50%;flex:none;border:1.5px solid rgba(0,0,0,.45)}
.sw.dia{border-radius:2px;transform:rotate(45deg);width:10px;height:10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;column-gap:12px}
.grid2 .row{min-width:0}
.h2r{display:flex;align-items:center;gap:10px}
.mini{font:600 10px var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--fg);background:var(--panel-2);border:1px solid var(--line);border-radius:999px;padding:3px 9px;cursor:pointer}
.mini:hover{border-color:#9b6cff}
.mini:focus-visible{outline:2px solid #9b6cff;outline-offset:2px}
.grid2 .gh{grid-column:1/-1;display:flex;justify-content:space-between;font:600 10px var(--f-body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:10px 4px 2px;padding-top:8px;border-top:1px solid var(--line)}
.grid2 .gh span{font:11px var(--f-mono);letter-spacing:0}
.pets{display:flex;flex-direction:column;gap:2px;max-height:none}
.petbar{display:flex;gap:8px;align-items:flex-start;justify-content:space-between;margin-bottom:8px}
.petbar select{padding:5px 8px;font-size:12px;flex:none}
.chips{display:flex;flex-wrap:wrap;gap:4px;min-width:0}
.chip{display:inline-flex;align-items:center;gap:5px;font:500 12px var(--f-body);color:var(--fg);background:var(--panel-2);border:1px solid var(--line);border-radius:999px;padding:4px 9px;cursor:pointer}
.chip .sw{width:8px;height:8px;border:0}
.chip small{color:var(--muted);font:11px var(--f-mono)}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.chip[aria-pressed="true"] small{color:var(--accent-ink)}
.chip:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.pets h3{font:600 11px var(--f-body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:10px 4px 2px;display:flex;align-items:center;gap:6px}
.pet{display:flex;gap:8px;align-items:center;background:none;border:0;color:var(--fg);text-align:left;padding:6px 4px;border-radius:6px;font:13px var(--f-body);cursor:pointer}
.pet:hover{background:var(--panel-2)}
.pet[aria-pressed="true"]{background:color-mix(in srgb,var(--pet) 22%,transparent)}
.pet .cat{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.pet .n{margin-left:auto;font:12px var(--f-mono);color:var(--muted)}
.note{color:var(--muted);font-size:12px;line-height:1.5;margin:16px 0 0}
.note a{color:var(--accent)}
#map{height:100%;background:var(--sea)}
.leaflet-container{background:var(--sea);font-family:var(--f-body)}
.hud{position:absolute;z-index:900;right:calc(12px + env(safe-area-inset-right,0px));bottom:calc(12px + env(safe-area-inset-bottom,0px));background:rgba(14,22,30,.85);color:#e6e1d6;border:1px solid #2a3846;border-radius:6px;padding:6px 10px;font:12px var(--f-mono);font-variant-numeric:tabular-nums;pointer-events:none}
.mapwrap{position:relative;min-width:0}
.credit{margin:18px 4px 0;font:11px/1.4 var(--f-body);color:var(--muted)}
.credit a{color:inherit}
.maptitle{position:absolute;z-index:900;left:20px;top:calc(16px + env(safe-area-inset-top,0px));pointer-events:none;font-family:var(--f-display);font-size:34px;color:#efe6cf;text-shadow:0 2px 12px rgba(0,0,0,.8);letter-spacing:.04em}
.maptitle small{display:block;font:600 11px var(--f-body);letter-spacing:.16em;text-transform:uppercase;color:var(--accent)}
.leaflet-bar a{background:#141e28;color:#e6e1d6;border-color:#2a3846}
.leaflet-bar a:hover{background:#1b2733}
.leaflet-popup-content-wrapper,.leaflet-popup-tip{background:#141e28;color:#e6e1d6;border:1px solid #2a3846}
.leaflet-popup-content{margin:12px 14px;font-size:13px}
.leaflet-container a.leaflet-popup-close-button{color:#93a0ad}
.pop{display:flex;gap:10px;align-items:flex-start;min-width:200px}
.pop img{width:64px;height:64px;border-radius:6px;object-fit:cover;background:#0e161e;border:1px solid #2a3846}
.pop b{font-family:var(--f-display);font-weight:400;font-size:17px;display:block;line-height:1.2}
.pop .k{font:600 10px var(--f-body);letter-spacing:.12em;text-transform:uppercase;color:#93a0ad;display:block;margin-bottom:2px}
.pop .c{font:11px var(--f-mono);color:#93a0ad;margin-top:4px;display:block}
.pop .t{display:inline-block;margin-top:6px;padding:2px 6px;border-radius:4px;background:rgba(239,106,76,.18);color:#ffb39f;font-size:12px}
.leaflet-tooltip{background:#141e28;color:#e6e1d6;border:1px solid #2a3846;box-shadow:none;font:12px var(--f-body)}
.leaflet-tooltip-top:before{border-top-color:#2a3846}

// Field boss: a horned shield with a skull; bosses on a fixed schedule are gold with a clock badge.
function bossSvg(fixed){
  const ink = "#1a0d08";
  return `<svg viewBox="0 0 24 26" width="20" height="22" aria-hidden="true">
    <path d="M6.4 8.2C4 5.6 4.2 3 5.6 1.6c.4 2.4 1.8 3.8 3.8 4.6zM17.6 8.2c2.4-2.6 2.2-5.2.8-6.6-.4 2.4-1.8 3.8-3.8 4.6z" fill="#efe3c6" stroke="${ink}" stroke-width="1.1" stroke-linejoin="round"/>

    <path d="M12 8.4c2.2 0 3.6 1.5 3.6 3.4 0 1.3-.7 2.2-1.6 2.7v1.6h-4v-1.6c-.9-.5-1.6-1.4-1.6-2.7 0-1.9 1.4-3.4 3.6-3.4z" fill="#fbf6ea"/>

    ${fixed?`<circle cx="19.4" cy="20.6" r="3.8" fill="#141c24" stroke="#ffd36b" stroke-width="1.1"/><path d="M19.4 18.6v2.1l1.5 1" stroke="#ffd36b" stroke-width="1" fill="none" stroke-linecap="round"/>`:""}
  </svg>`;
}
// Kibelisk: a teal crystal obelisk with a black outline and a faint rune
const KIB_SVG = `<svg viewBox="0 0 18 30" width="18" height="30" aria-hidden="true">
  <path d="M9 1.2l5.6 6.6-1.8 18.6H5.2L3.4 7.8z" fill="url(#kibg)" stroke="#000" stroke-width="1.5" stroke-linejoin="round"/>
  <path d="M9 1.2v25.2M3.4 7.8 9 10.4l5.6-2.6" stroke="rgba(0,40,40,.35)" stroke-width=".7" fill="none"/>

Object.assign(GLYPH, {Raydam:GLYPH.Mela, Morfa:GLYPH.Coriolus, Conide:GLYPH.Inina, Pujery:GLYPH.Cypri, Ohkra:GLYPH.Kukuru});
function gicon(kind){
  const col = (GK[kind]||["","#cfd3d8"])[1];
  return `<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="11.4" fill="#0f151b"/><circle cx="12" cy="12" r="10.4" fill="none" stroke="#c9a75a" stroke-width="1"/><circle cx="12" cy="12" r="9.3" fill="${col}"/><circle cx="12" cy="12" r="9.3" fill="url(#gshine)"/>${GLYPH[kind]||GLYPH[PARENT[kind]]||`<circle cx="12" cy="12" r="3" fill="${C}"/>`}</svg>`;

const SHINE = '<defs><radialGradient id="s" cx="35%" cy="30%" r="75%"><stop offset="0" stop-color="#fff" stop-opacity=".35"/><stop offset=".55" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".25"/></radialGradient></defs>';
const gBitmap = {};
function gBitmapFor(kind){
  if (gBitmap[kind]) return gBitmap[kind];
  const b = gBitmap[kind] = {ready:false, canvas:document.createElement("canvas")};
  b.canvas.width = b.canvas.height = 112;   // sharp up to the largest marker size
  const svg = gicon(kind).replace("<svg ", '<svg xmlns="http://www.w3.org/2000/svg" width="112" height="112" ').replace("url(#gshine)", "url(#s)").replace("<circle", SHINE + "<circle");
  const img = new Image();
  img.onload = () => {
    const g = b.canvas.getContext("2d");
    g.shadowColor = "rgba(0,0,0,.55)"; g.shadowBlur = 6; g.shadowOffsetY = 2;
    g.drawImage(img, 6, 4, 100, 100);
    b.ready = true;
    if (renderer && renderer._map) renderer._redraw();
  };
  img.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg);
  return b;
}
const IconDot = L.CircleMarker.extend({
  _updatePath(){
    const r = this._renderer;
    if (!r._drawing || this._empty()) return;
    const b = gBitmapFor(this.options.kind);
    if (!b.ready) return;
    const p = this._point, s = this._radius * 2 * 112/100;
    r._ctx.drawImage(b.canvas, p.x - s/2, p.y - s/2 + s*2/112, s, s);   // icon sits 2px above the bitmap centre
  }
});
const CAT = {Feral:"Fera",Intellect:"Cogni",Nature:"Natura",Trans:"Varian",Special:"Special"};
const CATC = {Feral:"#e8875a",Nature:"#7bd36b",Intellect:"#6fb8ff",Trans:"#c9a6ff",Special:"#ffd36b","":"#93a0ad"};
const DAYS = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];

// marker size: every dot keeps its base radius so the slider can scale it
let mk = Math.min(5, Math.max(1, Number(store.get("mkSize", 2)) || 2)), dots = [];
function dot(at, o, Cls = L.CircleMarker){ const r = o.radius; o.radius = r*mk; const c = new Cls(at, o); c._baseR = r; dots.push(c); return c; }
function applySize(){
  dots.forEach(c=>c.setRadius(c._baseR*mk));
  document.documentElement.style.setProperty("--mk", mk);
  el("mkOut").textContent = mk.toFixed(1)+"×";
}
// every gathering kind starts visible; only kinds the viewer switches off are remembered
const hidden = new Set(store.get("hiddenGather", []));
const saveKinds = () => store.set("hiddenGather", [...hidden]);
const el = id => document.getElementById(id);
el("lang").value = lang;

const nm = n => !n ? null : (n[lang] || n.en || Object.values(n)[0]);
const pts = p => (p.length && typeof p[0] === "number") ? [p] : p;   // single points arrive flattened
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt = n => Math.round(n).toLocaleString("en-US");

map = L.map("map", {crs:L.CRS.Simple, zoomSnap:0.25, zoomDelta:0.5, attributionControl:false, minZoom:-5, maxZoom:2, preferCanvas:true, zoomControl:true});
map.zoomControl.setPosition("topright");
map.createPane("tiles").style.zIndex = 250;   // keep the map picture under the canvas markers
renderer = L.canvas({padding:0.3});

function ll(m, x, y){ return L.latLng(-(m.oy + m.scale*y), m.ox + m.scale*x); }
function toWorld(m, latlng){ return [(latlng.lng - m.ox)/m.scale, (-latlng.lat - m.oy)/m.scale]; }

// Each tile ships as a colour JPEG plus a grey mask PNG (sea = black). Composite them into one transparent image.
function loadImg(src){ return new Promise((res,rej)=>{const i=new Image(); i.onload=()=>res(i); i.onerror=rej; i.src=src;}); }
async function masked(key, t){
  const id = key+"_"+t;
  if (maskCache[id]) return maskCache[id];
  const [c, m] = await Promise.all([loadImg("tiles/"+id+".jpg"), loadImg("tiles/"+id+"_a.png")]);
  const W = c.naturalWidth, H = c.naturalHeight;
  const cv = document.createElement("canvas"); cv.width=W; cv.height=H;
  const g = cv.getContext("2d");
  g.drawImage(m,0,0,W,H); const a = g.getImageData(0,0,W,H).data;
  g.clearRect(0,0,W,H); g.drawImage(c,0,0); const img = g.getImageData(0,0,W,H); const p = img.data;
  for (let i=0;i<p.length;i+=4) p[i+3] = a[i];
  g.putImageData(img,0,0);
  const url = await new Promise(r=>cv.toBlob(b=>r(URL.createObjectURL(b)),"image/webp",0.9));
  return maskCache[id] = url;
}

function popupBoss(b){
  let t = "";
  if (b.fixed){ const f=b.fixed; t = `<span class="t">${f.kind==="weekly"?"Weekly":esc(f.kind)}: ${(f.days||[]).map(d=>DAYS[d]).join(", ")} at ${esc(f.at||"")}${f.openMinutes?` · open ${f.openMinutes} min`:""}</span>`; }
  return `<div class="pop">${b.img?`<img src="thumbs/${esc(b.img)}" alt="">`:""}<div><span class="k">Field boss</span><b>${esc(nm(b.n))}</b>${t}<span class="c">NPC ${b.id} · x ${fmt(b.x)} y ${fmt(b.y)}</span></div></div>`;
}
function popupKib(k){ return `<div class="pop"><div><span class="k">Kibelisk</span><b>${esc(nm(k.n))}</b><span class="c">x ${fmt(k.x)} y ${fmt(k.y)}</span></div></div>`; }
function popupNpc(s, p){
  const pet = s.pet && D.pets[s.pet];
  return `<div class="pop"><div><span class="k">Pet monster</span><b>${esc(nm(s.n)||"NPC "+s.id)}</b>${pet?`<span class="c" style="color:#c9a6ff">Pet: ${esc(nm(pet.n))}</span>`:""}<span class="c">NPC ${s.id} · x ${fmt(p[0])} y ${fmt(p[1])}</span></div></div>`;
}

function petGroups(key){
  const g = new Map();
  for (const s of D.spawns[key]) {
    const k = s.pet ? "p"+s.pet : "n"+s.id;
    if (!g.has(k)) g.set(k, {k, pet:s.pet, npcs:[], count:0});
    const e = g.get(k); e.npcs.push(s); e.count += pts(s.p).length;
  }
  return [...g.values()].sort((a,b)=>b.count-a.count);
}

function build(key){
  const m = D.maps[key]; cur = key; dots = [];
  document.body.dataset.map = m.dungeon ? "dungeon" : key;
  document.querySelectorAll(".tabs button").forEach(b=>b.setAttribute("aria-pressed", b.dataset.map===key));
  el("dungeon").value = m.dungeon ? key : "";
  el("mapTitle").innerHTML = `<small>${m.dungeon ? "Dungeon" : FACTION[key]}</small>${esc(m.title)}`;
  Object.values(layers).forEach(l=>map.removeLayer(l)); if (tileLayer) map.removeLayer(tileLayer); if (petHi) { map.removeLayer(petHi); petHi=null; }
  selPet = null;

  const T = m.tile || 1024, S = T*m.grid;   // world maps use 1024 px tiles, dungeon maps 2048
  const tileBox = t => { const [c,r] = t.split("_").map(Number); return [[-r*T, c*T],[-(r+1)*T,(c+1)*T]]; };
  tileLayer = L.layerGroup().addTo(map);
  for (const t of m.tiles){
    const ov = L.imageOverlay("tiles/"+key+"_"+t+".jpg", tileBox(t), {opacity:0, pane:"tiles"}).addTo(tileLayer);
    if (m.masked === false) { ov.setOpacity(1); continue; }   // these dungeon pictures have no sea to cut away
    masked(key,t).then(u=>{ ov.setUrl(u); ov.setOpacity(1); }).catch(()=>ov.setOpacity(1));
  }
  const bounds = L.latLngBounds([[-S,0],[0,S]]);
  const land = L.latLngBounds(m.tiles.map(tileBox).flat());
  // clear the previous map's limits first, otherwise they pull the new view off centre
  map.setMaxBounds(null);
  map.setMinZoom(-6);
  map.invalidateSize();
  const z = map.getBoundsZoom(land, false, L.point(20,20));
  map.setView(land.getCenter(), z, {animate:false});
  map.setMinZoom(z-0.5);
  map.setMaxBounds(bounds.pad(0.25));

  // bosses
  const bl = L.layerGroup();
  for (const b of D.bosses[key]||[]) {
    const mk = L.marker(ll(m,b.x,b.y), {icon:L.divIcon({className:"mk-svg", html:bossSvg(!!b.fixed), iconSize:[20,22], iconAnchor:[10,12]}), keyboard:true, title:nm(b.n), zIndexOffset:500});
    mk.bindPopup(()=>popupBoss(b)); mk.bindTooltip(()=>esc(nm(b.n)), {direction:"top", offset:[0,-10]});
    mk._ref = b; bl.addLayer(mk);
  }
  layers.boss = bl;
  // kibelisks
  const kl = L.layerGroup();
  for (const k of D.kib[key]||[]) {
    const mk = L.marker(ll(m,k.x,k.y), {icon:L.divIcon({className:"mk-svg kib", html:KIB_SVG, iconSize:[18,30], iconAnchor:[9,28]}), title:nm(k.n), zIndexOffset:300});
    mk.bindPopup(()=>popupKib(k)); mk.bindTooltip(()=>esc(nm(k.n)), {direction:"top", offset:[0,-16]});
    mk._ref = k; kl.addLayer(mk);
  }
  layers.kib = kl;
  // gather
  const gl = L.layerGroup(); const byKind = {};
  for (const [id, list] of Object.entries(D.gather[key]||{})) {
    const info = D.gk[id]; const kind = info.kind; const col = (GK[kind]||["",'#fff'])[1];
    byKind[kind] = byKind[kind] || {n:0, layer:L.layerGroup()};
    for (const p of pts(list)) {
      const c = dot(ll(m,p[0],p[1]), {renderer, radius:5.5, kind}, IconDot);
      c.bindPopup(()=>`<div class="pop"><div><span class="k">${esc(GK[kind]?GK[kind][0]:kind)}</span><b>${esc(nm(info.n))}</b><span class="c">x ${fmt(p[0])} y ${fmt(p[1])}</span></div></div>`);
      c.bindTooltip(()=>esc(nm(info.n)));
      byKind[kind].layer.addLayer(c); byKind[kind].n++;
    }
  }
  layers.gather = gl;
  const rows = el("gatherRows"); rows.innerHTML = ""; let gTotal = 0;
  // single kinds first, then each split group under its own small heading
  const groupOf = k => PARENT[k] || "";
  const order = ["", ...GROUPS.map(g=>g[0])];
  const kinds = Object.keys(byKind).sort((a,b)=>order.indexOf(groupOf(a))-order.indexOf(groupOf(b)) || byKind[b].n-byKind[a].n);
  let lastGroup = "";
  for (const kind of kinds) {
    const grp = groupOf(kind);
    if (grp && grp !== lastGroup) {
      const h = document.createElement("h3"); h.className = "gh";
      const n = kinds.filter(k=>groupOf(k)===grp).reduce((s,k)=>s+byKind[k].n,0);
      h.innerHTML = `${esc(GROUPS.find(g=>g[0]===grp)[1])}<span>${n}</span>`;
      rows.appendChild(h);
    }
    lastGroup = grp;
    gTotal += byKind[kind].n;
    if (!hidden.has(kind)) gl.addLayer(byKind[kind].layer);
    const lab = document.createElement("label"); lab.className="row";
    lab.innerHTML = `<input type="checkbox" id="g_${kind}" ${hidden.has(kind)?"":"checked"}><span class="gsw">${gicon(kind)}</span>${esc(GK[kind]?GK[kind][0]:kind)}<span class="n">${byKind[kind].n}</span>`;
    lab.querySelector("input").addEventListener("change", e=>{
      if (e.target.checked){ hidden.delete(kind); gl.addLayer(byKind[kind].layer);} else { hidden.add(kind); gl.removeLayer(byKind[kind].layer);} saveKinds();
    });
    rows.appendChild(lab);
  }
  if (!kinds.length) rows.innerHTML = '<p class="note" style="margin:4px">No gathering spots in the data for this map.</p>';
  el("c_gather").textContent = gTotal || "";
  // one button hides every gathering kind, or shows them all again
  const gBtn = el("gToggle");
  const syncBtn = () => { gBtn.textContent = kinds.some(k=>!hidden.has(k)) ? "Hide all" : "Show all"; };
  gBtn.hidden = !kinds.length;
  gBtn.onclick = () => {
    const show = !kinds.some(k=>!hidden.has(k));
    for (const k of kinds) {
      const box = el("g_"+k);
      if (show) { hidden.delete(k); gl.addLayer(byKind[k].layer); } else { hidden.add(k); gl.removeLayer(byKind[k].layer); }
      if (box) box.checked = show;
    }
    saveKinds(); syncBtn();
  };
  rows.querySelectorAll("input").forEach(i=>i.addEventListener("change", syncBtn));
  syncBtn();
  // all pet spawns (faint)
  const pl = L.layerGroup(); let pTotal = 0;
  for (const s of D.spawns[key]) { const col = petColor(s); for (const p of pts(s.p)) {
    pTotal++;
    const c = dot(ll(m,p[0],p[1]), {renderer, radius:2.5, color:"#0b1117", weight:.6, fillColor:col, fillOpacity:.8});
    c.bindPopup(()=>popupNpc(s,p)); pl.addLayer(c);
  } }
  layers.pets = pl;
  el("c_boss").textContent = (D.bosses[key]||[]).length;
  el("c_kib").textContent = (D.kib[key]||[]).length;
  el("c_pets").textContent = fmt(pTotal);
  ["boss","kib","pets"].forEach(k=>{ if (el("L_"+k).checked) map.addLayer(layers[k]); });
  map.addLayer(gl);
  renderPets();
  store.set("map", key);
  if (location.hash !== "#"+key) history.replaceState(null, "", "#"+key);
}

// where every pet spawns, over all maps on this page: pet id -> [{key, count}]
const PET_MAPS = {};
for (const [key, list] of Object.entries(D.spawns)) for (const s of list) if (s.pet) {
  const arr = PET_MAPS[s.pet] = PET_MAPS[s.pet] || [];
  let e = arr.find(x=>x.key===key); if (!e) arr.push(e = {key, count:0});
  e.count += pts(s.p).length;
}
Object.values(PET_MAPS).forEach(a=>a.sort((x,y)=>y.count-x.count));
const placeLabel = s => s.replace(" ()", "");

// open another map and highlight one pet there
function goToPet(key, petId){
  el("q").value = ""; el("results").hidden = true;
  if (cur !== key) build(key);
  const g = petGroups(key).find(x=>x.k==="p"+petId);
  if (g && selPet !== g.k) highlight(g);
}

function renderPets(){
  const q = el("petq").value.trim().toLowerCase();
  const list = el("petList"); list.innerHTML = "";
  const groups = petGroups(cur).map(g=>{ const pet = g.pet && D.pets[g.pet];
    return Object.assign(g, {type: pet ? (pet.c||"") : "", title: pet ? nm(pet.n) : (nm(g.npcs[0].n) || "NPC "+g.npcs[0].id)}); });
  // pets the game has that do not spawn on this map
  const here = new Set(groups.filter(g=>g.pet).map(g=>String(g.pet)));
  const away = Object.entries(D.pets).filter(([id])=>!here.has(id)).map(([id,p])=>({id, type:p.c||"", title:nm(p.n)||("Pet "+id), maps:(PET_MAPS[id]||[]).filter(x=>x.key!==cur), other:(D.petElse&&D.petElse[id])||[]}));
  // type chips count every pet the game has
  const counts = {}; Object.values(D.pets).forEach(p=>counts[p.c||""]=(counts[p.c||""]||0)+1);
  const types = Object.keys(CAT).filter(t=>counts[t]);
  if (petType!=="all" && !counts[petType]) petType = "all";
  const chips = el("petTypes"); chips.innerHTML = "";
  [["all","All",Object.keys(D.pets).length]].concat(types.map(t=>[t,CAT[t],counts[t]])).forEach(([t,label,n])=>{
    const c = document.createElement("button"); c.type="button"; c.className="chip"; c.setAttribute("aria-pressed", petType===t);
    c.innerHTML = `${t!=="all"?`<span class="sw" style="background:${CATC[t]}"></span>`:""}${esc(label)} <small>${n}</small>`;
    c.onclick = ()=>{ petType = t; store.set("petType", t); renderPets(); };
    chips.appendChild(c);
  });
  const order = Object.keys(CAT);
  const rank = t => { const i = order.indexOf(t); return i<0 ? 99 : i; };
  groups.sort(petSort==="name" ? (a,b)=>a.title.localeCompare(b.title)
            : petSort==="type" ? (a,b)=>rank(a.type)-rank(b.type) || b.count-a.count
            : (a,b)=>b.count-a.count);
  let lastType = null;
  const onHere = groups.filter(g=>(petType==="all"||g.type===petType) && (!q || (g.title+" "+g.npcs.map(s=>nm(s.n)).join(" ")).toLowerCase().includes(q)));
  const secHere = document.createElement("h3"); secHere.className = "sec";
  secHere.textContent = `On this map · ${groups.filter(g=>g.pet).length} pets`;
  list.appendChild(secHere);
  if (!onHere.length) { const p = document.createElement("p"); p.className = "note"; p.style.margin = "4px"; p.textContent = "No matching pets spawn on this map."; list.appendChild(p); }
  for (const g of groups) {
    const pet = g.pet && D.pets[g.pet];
    const title = g.title;
    const mons = g.npcs.map(s=>nm(s.n)).filter(Boolean);
    if (petType!=="all" && g.type!==petType) continue;
    if (q && !(title+" "+mons.join(" ")).toLowerCase().includes(q)) continue;
    if (petSort==="type" && petType==="all" && g.type!==lastType) {
      lastType = g.type; const h = document.createElement("h3");
      h.innerHTML = `<span class="sw" style="background:${CATC[g.type]||CATC[""]};width:8px;height:8px;border:0"></span>${esc(CAT[g.type]||"Other")}`;
      list.appendChild(h);
    }
    const b = document.createElement("button"); b.type="button"; b.className="pet"; b.setAttribute("aria-pressed", selPet===g.k);
    b.innerHTML = `<span class="sw" style="background:${CATC[g.type]||CATC[""]}"></span><span><span style="display:block">${esc(title)}</span><span class="cat">${esc(pet?(CAT[pet.c]||pet.c||""):"monster")} · ${esc([...new Set(mons)].slice(0,2).join(", "))}${new Set(mons).size>2?" …":""}</span></span><span class="n">${g.count}</span>`;
    b.addEventListener("click", ()=>highlight(g));
    list.appendChild(b);
  }
  // everything else, with where to find it
  const shown = away.filter(a=>(petType==="all"||a.type===petType) && (!q || (a.title+" "+a.other.join(" ")).toLowerCase().includes(q)))
    .sort((a,b)=>(b.maps.length?1:0)-(a.maps.length?1:0) || (b.other.length?1:0)-(a.other.length?1:0) || a.title.localeCompare(b.title));
  const secAway = document.createElement("h3"); secAway.className = "sec";
  secAway.textContent = `Elsewhere · ${away.length} pets`;
  list.appendChild(secAway);
  for (const a of shown) {
    const row = document.createElement("div"); row.className = "pet else";
    const links = a.maps.map(x=>`<button type="button" data-key="${x.key}" data-pet="${a.id}" title="Open ${esc(D.maps[x.key].title)}">${esc(D.maps[x.key].title)} · ${x.count}</button>`).join("");
    const rest = a.other.map(o=>`<span>${esc(placeLabel(o))}</span>`).join("");
    const none = (!links && !rest) ? `<span>No spawn place in the game data (shop, event or reward pet)</span>` : "";
    row.innerHTML = `<span style="display:flex;gap:8px;align-items:center"><span class="sw" style="background:${CATC[a.type]||CATC[""]}"></span><span>${esc(a.title)}<span class="cat" style="display:block">${esc(CAT[a.type]||a.type||"")}</span></span></span><span class="where">${links}${rest}${none}</span>`;
    row.querySelectorAll("button[data-key]").forEach(l=>l.addEventListener("click", ()=>goToPet(l.dataset.key, l.dataset.pet)));
    list.appendChild(row);
  }
}

// enemy monsters take the colour of their pet type (Fera, Cogni, Natura, Varian)
function petColor(s){ const pet = s.pet && D.pets[s.pet]; return CATC[pet ? (pet.c||"") : ""] || CATC[""]; }

function highlight(g){
  const m = D.maps[cur];
  if (petHi) { map.removeLayer(petHi); petHi = null; }
  if (selPet === g.k) { selPet = null; renderPets(); return; }
  selPet = g.k; petHi = L.layerGroup().addTo(map);
  const ls = [];
  for (const s of g.npcs) for (const p of pts(s.p)) {
    const at = ll(m,p[0],p[1]); ls.push(at);
    dot(at, {renderer, radius:5, color:"#0b1117", weight:1.5, fillColor:petColor(s), fillOpacity:1}).bindPopup(()=>popupNpc(s,p)).addTo(petHi);
  }
  if (ls.length) map.flyToBounds(L.latLngBounds(ls).pad(0.3), {maxZoom:0, duration:.6});
  renderPets();
}

// search across the open map
function search(){
  const q = el("q").value.trim().toLowerCase(); const box = el("results");
  if (q.length < 2) { box.hidden = true; return; }
  const hits = [];
  layers.boss.eachLayer(mk=>{ const n=nm(mk._ref.n); if (n.toLowerCase().includes(q)) hits.push({t:n, k:"Field boss", go:()=>{ if(!map.hasLayer(layers.boss)){el("L_boss").checked=true;map.addLayer(layers.boss);} map.flyTo(mk.getLatLng(), 0, {duration:.6}); setTimeout(()=>mk.openPopup(),650);} }); });
  layers.kib.eachLayer(mk=>{ const n=nm(mk._ref.n); if (n.toLowerCase().includes(q)) hits.push({t:n, k:"Kibelisk", go:()=>{ if(!map.hasLayer(layers.kib)){el("L_kib").checked=true;map.addLayer(layers.kib);} map.flyTo(mk.getLatLng(), 0, {duration:.6}); setTimeout(()=>mk.openPopup(),650);} }); });
  for (const g of petGroups(cur)) {
    const pet = g.pet && D.pets[g.pet]; const pn = pet ? nm(pet.n) : null;
    const mons = [...new Set(g.npcs.map(s=>nm(s.n)).filter(Boolean))];
    const hitMon = mons.find(x=>x.toLowerCase().includes(q));
    if ((pn && pn.toLowerCase().includes(q)) || hitMon) hits.push({t: hitMon && !(pn||"").toLowerCase().includes(q) ? hitMon : (pn||hitMon), k: pn ? "Pet · "+g.count+" spawns" : "Monster", go:()=>{ if (selPet===g.k) return; highlight(g);} });
  }
  box.innerHTML = hits.length ? "" : '<div class="hit" style="cursor:default;color:var(--muted)">Nothing on this map. Try another map.</div>';
  hits.slice(0,40).forEach(h=>{ const b=document.createElement("button"); b.type="button"; b.className="hit"; b.innerHTML=`${esc(h.t)}<em>${esc(h.k)}</em>`; b.onclick=()=>{ box.hidden=true; h.go(); }; box.appendChild(b); });
  box.hidden = false;
}

el("q").addEventListener("input", search);
el("q").addEventListener("keydown", e=>{ if (e.key==="Escape"){ el("results").hidden=true; } if (e.key==="Enter"){ const f=el("results").querySelector("button.hit"); if(f) f.click(); }});
document.addEventListener("click", e=>{ if (!e.target.closest(".tools")) el("results").hidden = true; });
el("petq").addEventListener("input", renderPets);
el("mkSize").value = mk;
el("mkSize").addEventListener("input", e=>{ mk = Number(e.target.value); applySize(); store.set("mkSize", mk); });
L.DomEvent.disableClickPropagation(document.querySelector(".sizer"));el("lang").addEventListener("change", e=>{ lang = e.target.value; store.set("lang", lang); renderPets(); search(); map.closePopup(); });
["boss","kib","pets"].forEach(k=>el("L_"+k).addEventListener("change", e=>{ e.target.checked ? map.addLayer(layers[k]) : map.removeLayer(layers[k]); store.set("L_"+k, e.target.checked); }));
["boss","kib","pets"].forEach(k=>{ const v = store.get("L_"+k, null); if (v !== null) el("L_"+k).checked = v; });
document.querySelectorAll(".tabs button").forEach(b=>b.addEventListener("click", ()=>{ el("q").value=""; el("results").hidden=true; el("petq").value=""; build(b.dataset.map); }));
// dungeon picker: every dungeon map, alphabetically
Object.entries(D.maps).filter(([,m])=>m.dungeon).sort((a,b)=>a[1].title.localeCompare(b[1].title)).forEach(([k,m])=>{
  const o = document.createElement("option"); o.value = k; o.textContent = m.title; el("dungeon").appendChild(o);
});
el("dungeon").addEventListener("change", e=>{ if (e.target.value) { el("q").value=""; el("results").hidden=true; build(e.target.value); } });
map.on("mousemove", e=>{ const w = toWorld(D.maps[cur], e.latlng); el("hud").textContent = `x ${fmt(w[0])}  y ${fmt(w[1])}`; });
el("sheetBtn").addEventListener("click", ()=>{ const s=el("side"); const c=s.classList.toggle("collapsed"); el("sheetBtn").textContent = c?"Show panel":"Hide panel"; el("sheetBtn").setAttribute("aria-expanded", !c); setTimeout(()=>map.invalidateSize(),50); });
new ResizeObserver(()=>map.invalidateSize()).observe(el("map"));

window.addEventListener("hashchange", ()=>{ const k=location.hash.slice(1); if (D.maps[k] && k!==cur) build(k); });
const start = (location.hash||"").slice(1);
build(D.maps[start] ? start : store.get("map","verteron"));
applySize();
el("swBoss").innerHTML = bossSvg(false);
el("swKib").innerHTML = KIB_SVG;
})();
</script>
